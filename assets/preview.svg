<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#f1f3f0"/>
  <rect x="18" y="18" width="988" height="52" rx="9" fill="#ffffff" stroke="#d8ddd7"/>
  <circle cx="42" cy="44" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="44" r="6" fill="#febc2e"/>
  <circle cx="82" cy="44" r="6" fill="#28c840"/>
  <text x="512" y="51" text-anchor="middle" fill="#68756f" font-family="Inter, sans-serif" font-size="16">YING Kami · 思源笔记</text>
  <rect x="18" y="84" width="218" height="666" rx="9" fill="#f7f8f6" stroke="#d8ddd7"/>
  <text x="42" y="126" fill="#26312c" font-family="Inter, PingFang SC, sans-serif" font-size="18">文档</text>
  <path d="M42 148h170" stroke="#d8ddd7"/>
  <g font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="17">
    <text x="46" y="188" fill="#a66f22">今日工作台</text>
    <text x="46" y="226" fill="#46534d">科研推进</text>
    <text x="46" y="264" fill="#46534d">教学记录</text>
    <text x="46" y="302" fill="#68756f">长期知识库</text>
  </g>
  <rect x="250" y="84" width="756" height="666" rx="9" fill="#ffffff" stroke="#d8ddd7"/>
  <g transform="translate(306 128)">
    <text x="0" y="46" fill="#26312c" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="46">YING Kami 主题验收</text>
    <path d="M0 66h640" stroke="#bdc6bd"/>
    <text x="0" y="124" fill="#065279" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="30">字体与层级</text>
    <path d="M0 140h640" stroke="#d8ddd7"/>
    <text x="0" y="184" fill="#26312c" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="21">正文保持舒展，适合中文长文、科研记录和教学复盘。</text>
    <text x="0" y="222" fill="#46534d" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="20">Tag 使用</text>
    <rect x="80" y="199" width="108" height="30" rx="15" fill="#e3f0f4" fill-opacity="0.72" stroke="#065279" stroke-opacity="0.28"/>
    <text x="134" y="221" text-anchor="middle" fill="#065279" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="17" font-weight="600">科研/周报</text>
    <text x="204" y="222" fill="#46534d" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="20">，链接使用 <tspan fill="#3f7588">安静青蓝</tspan>。</text>
    <rect x="0" y="260" width="640" height="218" rx="10" fill="#1a1b26"/>
    <rect x="0" y="260" width="640" height="38" rx="10" fill="#2d2d3a"/>
    <circle cx="20" cy="279" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="279" r="5" fill="#febc2e"/>
    <circle cx="56" cy="279" r="5" fill="#28c840"/>
    <text x="320" y="284" text-anchor="middle" fill="#8a8a9a" font-family="SF Mono, monospace" font-size="12">Weekly report</text>
    <g font-family="SF Mono, monospace" font-size="17">
      <text x="24" y="340" fill="#bb9af7">def <tspan fill="#7aa2f7">build_report</tspan><tspan fill="#a9b1d6">(items):</tspan></text>
      <text x="48" y="380" fill="#a9b1d6">done = [item <tspan fill="#bb9af7">for</tspan> item <tspan fill="#bb9af7">in</tspan> items]</text>
      <text x="48" y="420" fill="#bb9af7">return <tspan fill="#a9b1d6">{</tspan><tspan fill="#9ece6a">"completed"</tspan><tspan fill="#a9b1d6">: len(done)}</tspan></text>
      <text x="574" y="458" fill="#8a8a9a" font-size="11">python</text>
    </g>
    <rect x="0" y="514" width="640" height="72" rx="6" fill="#f7f9f7" stroke="#d8ddd7"/>
    <path d="M0 514v72" stroke="#a66f22" stroke-width="3"/>
    <text x="24" y="557" fill="#53615a" font-family="LXGW WenKai, 霞鹜文楷, serif" font-size="19">把复杂工作拆成下一步可行动作，让界面只保留当下真正需要关注的信息。</text>
  </g>
</svg>
